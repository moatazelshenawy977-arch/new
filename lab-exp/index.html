<!doctype html>
<html lang="en" class="-preload">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAB.EXP — Experiments</title>
  <meta name="description" content="Ideas taking shape through code and design." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400&family=Manrope:wght@400;500;600&family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <canvas id="gl" aria-hidden="true"></canvas>

  <header class="bar top -w">
    <a class="logo -mm -up" href="#">LAB.EXP</a>
    <button class="toggle -mm -up" id="toggle"><span class="-active" data-mode="list">List</span><span>/</span><span data-mode="grid">Grid</span></button>
    <span class="mark -mm -up -jp" aria-hidden="true">エクス</span>
    <button class="about -mm -up" id="aboutBtn">About</button>
    <a class="talk -mm -up" href="mailto:hello@example.com">Let's talk</a>
  </header>

  <div class="title -lrg" id="title" aria-live="polite">LAB.EXP</div>
  <span class="progress" id="progress"></span>

  <footer class="bar bottom -w">
    <button class="sfx -mm -up" id="sfx" aria-pressed="false">sfx</button>
    <span class="hub -mm -up">Experiments Hub</span>
    <div class="colours -mm -up" id="colours">
      <button class="-active" data-theme="black">Black</button><button data-theme="red">Red</button><button data-theme="green">Green</button><button data-theme="yellow">Yellow</button><button data-theme="blue">Blue</button>
    </div>
    <span class="year -mm -up">©2026</span>
  </footer>

  <aside class="panel" id="panel" aria-hidden="true">
    <button class="close -mm -up" id="close">Close ✕</button>
    <h3 id="pTitle"></h3>
    <p id="pText"></p>
    <small class="-mm -up" id="pMeta"></small>
  </aside>

  <div class="splash" id="splash" aria-hidden="true"><div class="grid" id="splashGrid"></div><div class="core"></div></div>

  <div class="cookie" id="cookie" role="dialog" aria-label="Cookies">
    <b>Cookies</b>
    <p>This website uses only essential cookies to work properly. We never collect personal data.</p>
    <div><button class="primary" data-c>Accept all</button><button data-c>Reject all</button></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
