<!doctype html>
<html lang="en" class="-preload">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NILE.LAB — Properties in Egypt and the Gulf</title>
  <meta name="description" content="Browse selected properties and talk to an advisor on WhatsApp." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400&family=Manrope:wght@400;500;600&family=Noto+Sans+JP:wght@400&family=Noto+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <canvas id="gl" aria-hidden="true"></canvas>

  <header class="bar top -w">
    <a class="logo -mm -up" href="#">NILE.LAB</a>
    <button class="toggle -mm -up" id="toggle"><span class="-active" data-mode="list">List</span><span>/</span><span data-mode="grid">Grid</span></button>
    <span class="mark -mm -up -jp" aria-hidden="true">エクス</span>
    <button class="about -mm -up" id="aboutBtn">About</button>
    <button class="talk -mm -up" id="talkBtn">Let's talk</button>
    <button class="lang -mm -up" id="lang" aria-label="Switch language">AR</button>
  </header>

  <nav class="filters -mm -up" id="filters" aria-label="Filter by country"><button class="-active" data-f="all">All</button><button data-f="eg">Egypt</button><button data-f="sa">Saudi Arabia</button><button data-f="ae">UAE</button></nav>

  <div class="title -lrg" id="title" aria-live="polite">NILE.LAB</div>
  <span class="progress" id="progress"></span>

  <footer class="bar bottom -w">
    <button class="sfx -mm -up" id="sfx" aria-pressed="false">sfx</button>
    <span class="hub -mm -up">Properties</span>
    <div class="colours -mm -up" id="colours">
      <button class="-active" data-theme="black">Black</button><button data-theme="red">Red</button><button data-theme="green">Green</button><button data-theme="yellow">Yellow</button><button data-theme="blue">Blue</button>
    </div>
    <span class="year -mm -up">©2026</span>
  </footer>

  <aside class="panel" id="panel" aria-hidden="true">
    <button class="close -mm -up" id="close">Close ✕</button>
    <h3 id="pTitle"></h3>
    <p id="pText"></p>
    <dl class="facts -mm -up" id="pFacts"></dl>
    <a class="cta" id="pCta" target="_blank" rel="noopener">Ask on WhatsApp</a>
    <form class="lead" id="lead" hidden>
      <input id="fName" name="name" autocomplete="name" required />
      <input id="fPhone" name="phone" type="tel" autocomplete="tel" required />
      <textarea id="fWant" name="want" rows="3" required></textarea>
      <button class="cta" type="submit" id="fSend">Send on WhatsApp</button>
    </form>
    <small class="-mm -up" id="pMeta"></small>
  </aside>

  <div class="splash" id="splash" aria-hidden="true"><div class="grid" id="splashGrid"></div><div class="core"></div></div>

  <div class="cookie" id="cookie" role="dialog" aria-label="Cookies">
    <b>Cookies</b>
    <p>This website uses only essential cookies to work properly. We never collect personal data.</p>
    <div><button class="primary" data-c>Accept all</button><button data-c>Reject all</button></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
